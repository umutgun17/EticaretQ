<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>EticaretQ Akıllı Menü — Demo</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#eef0f4;color:#111827}
    .gal{display:flex;flex-wrap:wrap;gap:22px;justify-content:center;padding:26px 16px 40px}
    .ph{width:300px;background:#111;border-radius:38px;padding:10px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
    .ph .scr{background:#fff;border-radius:30px;overflow:hidden;height:600px;position:relative}
    .ph iframe{width:100%;height:100%;border:0;display:block}
    .ph .nm{text-align:center;color:#fff;font-size:13px;font-weight:600;padding:10px 0 2px}
    .ph .nm small{display:block;color:#9ca3af;font-weight:400;font-size:11px;margin-top:2px}
    .gh{padding:26px 16px 0;text-align:center}.gh h1{margin:0 0 4px;font-size:22px}.gh p{margin:0;color:#6b7280;font-size:14px}
    /* tek telefon: sahte mağaza + menü */
    .store{background:#fff;min-height:100vh}
    .top{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #f1f2f5}
    .top .logo{font-weight:800;letter-spacing:1px;font-size:17px}
    .top .ic{display:flex;gap:14px;color:#374151}.top .ic svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7}
    .burger{width:26px;height:26px;stroke:#111;fill:none;stroke-width:2;cursor:pointer}
    .hero{margin:10px 12px;border-radius:14px;background:linear-gradient(135deg,#111827,#374151);color:#fff;padding:22px 16px;font-weight:800;font-size:20px;line-height:1.15}
    .hero small{display:block;font-weight:500;font-size:12px;opacity:.75;margin-top:6px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 12px 40px}
    .card .im{aspect-ratio:3/4;background:#f3f4f6;border-radius:12px}
    .ln{height:9px;border-radius:5px;background:#e5e7eb;margin:8px 4px 0}.ln.s{width:60%}
    .note{position:fixed;top:8px;left:8px;right:8px;z-index:5;background:rgba(17,24,39,.85);color:#fff;font-size:11px;border-radius:10px;padding:7px 10px;text-align:center;pointer-events:none}
  </style>
</head>
<body>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var tenant = q.get('tenant') || 'tonnyblack';
    var preset = q.get('preset') || '';
    var themeJson = q.get('theme') || '';
    var profile = q.get('profile') || '';
    var gallery = q.get('gallery') === '1';
    var open = q.get('open') !== '0';
    if (gallery) {
      var presets = [['cards', 'Kartlar', 'Ürün görselli kare kartlar (Slazenger deseni)'], ['list', 'Görselli Liste', 'Küçük görselli satırlar, sayılar sağda'], ['bento', 'Bento', 'Karışık boyutlu kartlar, öne çıkan geniş'], ['story', 'Hikâye', 'Yuvarlak görseller, 4 sütun (Trendyol deseni)'], ['mono', 'Mono', 'Siyah-beyaz, keskin köşe, büyük harf'], ['dark', 'Koyu', 'Koyu zemin, açık kartlar']];
      document.body.innerHTML = '<div class="gh"><h1>Akıllı Menü — tema galerisi</h1><p>Her telefon canlı widget\'tır: sekmelere ve kartlara dokunabilirsiniz (demo: sayfa açılmaz). Kategoriler, görseller ve ürünler mağazanın gerçek verisi.</p></div><div class="gal">' +
        presets.map(function (p) { return '<div class="ph"><div class="scr"><iframe src="' + location.pathname + '?tenant=' + encodeURIComponent(tenant) + '&preset=' + p[0] + (profile ? '&profile=' + encodeURIComponent(profile) : '') + '" loading="lazy"></iframe></div><div class="nm">' + p[1] + '<small>' + p[2] + '</small></div></div>'; }).join('') + '</div>';
      return;
    }
    var svg = { search: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>', bag: '<svg viewBox="0 0 24 24"><path d="M6 8h12l1 12H5z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>' };
    document.body.innerHTML = '<div class="store"><div class="top"><svg class="burger newMenuBtnClick" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span class="logo">MAĞAZANIZ</span><span class="ic">' + svg.search + svg.bag + '</span></div>' +
      '<div class="hero">Yeni sezon<small>Hamburger ikonuna dokunun: Akıllı Menü açılır</small></div><div class="grid">' + [1, 2, 3, 4].map(function () { return '<div class="card"><div class="im"></div><div class="ln"></div><div class="ln s"></div></div>'; }).join('') + '</div></div>';
    if (!open) document.body.insertAdjacentHTML('beforeend', '<div class="note">Hamburger ikonuna dokunun</div>');
    var s = document.createElement('script');
    s.src = '/widget/menu.js?v=' + (q.get('v') || Date.now());
    s.setAttribute('data-tenant', tenant);
    s.setAttribute('data-force', '1');
    if (open) s.setAttribute('data-open', '1');
    if (preset) s.setAttribute('data-preset', preset);
    if (themeJson) s.setAttribute('data-theme', themeJson);
    if (profile) s.setAttribute('data-profile', profile);
    document.body.appendChild(s);
    // demo'da hamburger: force modunda capture handler devre dışı → doğrudan aç
    document.addEventListener('click', function (e) { if (e.target.closest && e.target.closest('.burger') && window.YunbiMenu) window.YunbiMenu.open('hamburger'); });
  })();
</script>
</body>
</html>
