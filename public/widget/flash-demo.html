<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Yunbi Flaş İndirim Vitrini — Demo</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#fff;color:#111827}
    .store{max-width:none;margin:0 auto;background:#fff;min-height:100vh}
    .top{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid #f1f2f5}
    .top .logo{font-weight:900;letter-spacing:2px;font-size:18px}
    .top nav{display:flex;gap:22px;font-size:13.5px;color:#374151;font-weight:600}
    .top .ic{display:flex;gap:16px;color:#374151}.top .ic svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7}
    /* Tonny Black tarzı başlık */
    .tb .ann{background:#111;color:#fff;font-size:12px;font-weight:600;text-align:center;padding:7px 10px;letter-spacing:.3px}
    .tb .top{padding:12px 28px;border-bottom:0;max-width:1400px;margin:0 auto}
    .tb .top .logo img{height:34px;display:block}
    .tb nav{gap:26px;font-size:14px;font-weight:700;color:#111;letter-spacing:.3px;text-transform:uppercase}
    .tb nav .hot{background:linear-gradient(90deg,#ff1744,#d50000);color:#fff;padding:7px 14px;border-radius:6px}
    .tb nav .b11{background:linear-gradient(90deg,#6d28d9,#db2777);color:#fff;padding:7px 14px;border-radius:6px}
    .tb .mobhead{display:none}
    .tb .cats{display:flex;gap:10px;padding:10px 12px;overflow:auto;scrollbar-width:none}.tb .cats span{flex:none;border:1px solid #e5e7eb;border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:700;color:#111}.tb .cats span.hot{background:#e3001b;border-color:#e3001b;color:#fff}
    .tb .guven{display:flex;justify-content:center;gap:34px;padding:22px 20px;border-top:1px solid #f1f2f5;border-bottom:1px solid #f1f2f5;font-size:13px;font-weight:700;color:#111;flex-wrap:wrap}.tb .guven span:before{content:"";display:inline-block;width:18px;height:18px;border-radius:50%;background:#111;margin-right:8px;vertical-align:-4px}
    .tb .blocks{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:12px 12px 120px;max-width:1400px;margin:0 auto}.tb .blocks div{aspect-ratio:4/5;border-radius:4px;background:#ececec;display:flex;align-items:flex-end;padding:16px;font-weight:900;font-size:20px;color:#111;letter-spacing:1px}
    #sliderblok_0{margin:14px 22px;border-radius:16px;background:linear-gradient(135deg,#111827,#374151);color:#fff;padding:46px 30px;font-weight:800;font-size:30px;line-height:1.1}
    .tb #sliderblok_0{margin:0;border-radius:0;padding:120px 30px;text-align:center}
    #sliderblok_0 small{display:block;font-weight:500;font-size:13px;opacity:.75;margin-top:8px}
    .trust{display:flex;gap:18px;justify-content:center;padding:14px 22px;font-size:12px;color:#6b7280;flex-wrap:wrap}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:0 22px 120px}
    .card{border-radius:12px;overflow:hidden;background:#fff}
    .card .im{aspect-ratio:3/4;background:#f3f4f6;display:flex;align-items:center;justify-content:center;color:#d1d5db}.card .im svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:1.5}
    .card .im.a{background:#f1f5f9}.card .im.b{background:#f5f3ff}.card .im.c{background:#fdf2f8}.card .im.d{background:#ecfdf5}
    .ln{height:9px;border-radius:5px;background:#e5e7eb;margin:8px 4px 0}.ln.s{width:60%}.ln.p{width:40%;background:#cbd5e1;margin-top:10px;height:11px}
    @media (max-width:640px){.grid{grid-template-columns:1fr 1fr;gap:12px;padding:0 12px 120px}.top{padding:12px 14px}.top nav{display:none}#sliderblok_0{margin:10px 12px;padding:24px 16px;font-size:20px}
      .tb .top{display:none}.tb .mobhead{display:flex;align-items:center;justify-content:space-between;padding:10px 14px}.tb .mobhead img{height:26px}.tb .mobhead svg{width:24px;height:24px;stroke:#111;fill:none;stroke-width:1.8}.tb .mobhead .r{display:flex;gap:14px}
      .tb #sliderblok_0{padding:40px 16px}.tb .guven{gap:14px;padding:14px 10px;font-size:11.5px}.tb .blocks{grid-template-columns:1fr 1fr;gap:8px;padding:8px 8px 120px}.tb .blocks div{font-size:14px;padding:10px}}
    /* demo kontrol çubuğu */
    .ctl{position:sticky;top:0;z-index:50;display:flex;gap:8px;align-items:center;padding:8px 12px;background:rgba(17,24,39,.94);color:#fff;font-size:12px;overflow-x:auto;scrollbar-width:none;backdrop-filter:blur(8px)}
    .ctl::-webkit-scrollbar{display:none}
    .ctl b{font-size:11px;opacity:.7;letter-spacing:.5px;flex:none}
    .ctl button{flex:none;border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer}
    .ctl button.on{background:#fff;color:#111827}
    .ctl .sw{width:14px;height:14px;border-radius:50%;display:inline-block;vertical-align:-2px;margin-right:5px;border:1px solid rgba(255,255,255,.4)}
    .ctl .gap{width:10px;flex:none}
    .note{padding:8px 12px;background:#fef3c7;color:#92400e;font-size:11.5px;text-align:center}
  </style>
</head>
<body>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var tenant = q.get('tenant') || 'tonnyblack';
    var layout = q.get('layout') || '', preset = q.get('preset') || '';
    var themeJson = q.get('theme') || '', rulesJson = q.get('rules') || '';
    var brand = q.get('brand') || 'MAĞAZANIZ';
    var LAYOUTS = [['spotlight', 'Spotlight'], ['grid', 'Izgara'], ['rail', 'Ray'], ['split', 'Poster'], ['tabs', 'Sekmeli'], ['stories', 'Hikâye']];
    var PRESETS = [['tonny', 'Tonny Siyah', '#e3001b'], ['tonnywhite', 'Tonny Beyaz', '#ffffff'], ['rain', 'Yağmur', '#2563eb'], ['night', 'Gece', '#a855f7'], ['red', 'Kırmızı', '#e3001b'], ['ember', 'Kor', '#f97316'], ['forest', 'Orman', '#22c55e'], ['mono', 'Mono', '#111111']];
    var svg = { search: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>', heart: '<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>', bag: '<svg viewBox="0 0 24 24"><path d="M6 7h12l1 14H5L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>', img: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/></svg>' };
    var tones = ['a', 'b', 'c', 'd', 'b', 'a', 'd', 'c'];
    var ctl = q.get('ctl') !== '0' ? '<div class="ctl"><b>YERLEŞİM</b>' + LAYOUTS.map(function (l) { return '<button data-layout="' + l[0] + '">' + l[1] + '</button>'; }).join('') +
      '<span class="gap"></span><b>RENK</b>' + PRESETS.map(function (p) { return '<button data-preset="' + p[0] + '"><span class="sw" style="background:' + p[2] + '"></span>' + p[1] + '</button>'; }).join('') + '</div>' : '';
    var tonny = (q.get('brand') || (tenant === 'tonnyblack' ? 'tonny' : '')) === 'tonny';
    var note = (q.get('note') !== '0' ? '<div class="note">Demo mağaza — vitrin canlı widget’tır; ürünler, fiyatlar, satış adetleri ve sayaç GERÇEK veridir. Sepete ekleme yalnız mağazada çalışır.</div>' : '');
    if (tonny) {
      var LOGO = 'https://static.ticimax.cloud/59755/Uploads/HeaderTasarim/Header3/d210a7b6-1af3-4cce-9d06-d76585f5515f.jpg';
      var menu = '<svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>', user = '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>';
      document.body.innerHTML = ctl + '<div class="store tb"><div class="ann">1000 TL ÜZERİ ÜCRETSİZ KARGO · KAPIDA ÖDEME · 14 GÜN KOLAY İADE</div>' +
        '<div class="top"><span class="logo"><img src="' + LOGO + '" alt="Tonny Black"></span><nav><span>Kadın</span><span>Erkek</span><span>Çocuk</span><span class="hot">10/10 İndirimi</span><span class="b11">1 Alana 1 Bedava</span><span>Fırsat Ürünleri</span></nav><span class="ic">' + svg.search + user + svg.heart + svg.bag + '</span></div>' +
        '<div class="mobhead">' + menu + '<img src="' + LOGO + '" alt="Tonny Black"><span class="r">' + svg.search + svg.bag + '</span></div>' +
        '<section id="sliderblok_0">ESKİ SLIDER<small>Masaüstünde bu blok gizlenir; mobilde Tonny’de slider zaten yok</small></section>' +
        '<div class="cats"><span class="hot">10/10 İndirimi</span><span>1 Alana 1 Bedava</span><span>Fırsat</span><span>Kadın Bot</span><span>Erkek Bot</span><span>Çocuk Bot</span><span>Sneaker</span></div>' +
        '<div class="guven"><span>Ücretsiz Kargo</span><span>Kapıda Ödeme</span><span>Kolay İade</span><span>Güvenli Alışveriş</span></div>' +
        '<div class="blocks"><div>KADIN SPOR AYAKKABI</div><div>KADIN LOAFER</div><div>KADIN BOT</div><div>ERKEK TREKKING</div><div>KADIN ÇİZME</div><div>ÇOCUK BOT</div></div></div>' + note;
    } else {
      document.body.innerHTML = ctl + '<div class="store"><div class="top"><span class="logo">' + brand + '</span><nav><span>Kadın</span><span>Erkek</span><span>Çocuk</span><span>İndirim</span></nav><span class="ic">' + svg.search + svg.heart + svg.bag + '</span></div>' +
        '<section id="sliderblok_0">ESKİ SLIDER<br>(Flaş vitrin bunun yerine gelir)<small>Widget yüklenince bu blok gizlenir</small></section>' +
        '<div class="trust"><span>✓ Ücretsiz Kargo</span><span>✓ 14 Gün İade</span><span>✓ Güvenli Ödeme</span><span>✓ Kapıda Ödeme</span></div>' +
        '<div class="grid">' + tones.map(function (t) { return '<div class="card"><div class="im ' + t + '">' + svg.img + '</div><div class="ln"></div><div class="ln s"></div><div class="ln p"></div></div>'; }).join('') + '</div></div>' + note;
    }
    var s = document.createElement('script');
    s.src = '/widget/flash.js?v=' + Date.now();
    s.setAttribute('data-tenant', tenant);
    s.setAttribute('data-force', '1');
    s.setAttribute('data-mount', '#sliderblok_0');
    if (layout) s.setAttribute('data-layout', layout);
    if (preset) s.setAttribute('data-preset', preset);
    if (themeJson) s.setAttribute('data-theme', themeJson);
    if (rulesJson) s.setAttribute('data-rules', rulesJson);
    s.setAttribute('data-debug', '1');
    document.body.appendChild(s);
    function sync() {
      var c = window.YunbiFlash && window.YunbiFlash.config(); if (!c) return;
      document.querySelectorAll('.ctl [data-layout]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-layout') === c.theme.layout); });
      document.querySelectorAll('.ctl [data-preset]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-preset') === c.theme.preset); });
    }
    document.addEventListener('click', function (e) {
      var b = e.target.closest && e.target.closest('.ctl button'); if (!b || !window.YunbiFlash) return;
      if (b.getAttribute('data-layout')) { window.YunbiFlash.setLayout(b.getAttribute('data-layout')); history.replaceState(null, '', '?' + new URLSearchParams(Object.assign(Object.fromEntries(q), { layout: b.getAttribute('data-layout') })).toString()); }
      if (b.getAttribute('data-preset')) { window.YunbiFlash.setPreset(b.getAttribute('data-preset')); history.replaceState(null, '', '?' + new URLSearchParams(Object.assign(Object.fromEntries(q), { preset: b.getAttribute('data-preset') })).toString()); }
      q = new URLSearchParams(location.search); sync();
    });
    var iv = setInterval(function () { if (window.YunbiFlash) { sync(); clearInterval(iv); } }, 200);
  })();
</script>
</body>
</html>
