<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Uygulamaya Özel — Yazdırılabilir QR</title>
  <style>
    body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f6f7f9;color:#111827;display:flex;align-items:center;justify-content:center;min-height:100vh}
    .card{background:#fff;border-radius:24px;padding:36px 40px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.08);max-width:440px}
    .card h1{font-size:22px;margin:0 0 6px;letter-spacing:-.01em}.card p{margin:0;color:#6b7280;font-size:14px;line-height:1.5}
    .qr{margin:22px auto 16px;width:280px;height:280px}.qr svg{width:100%;height:100%}
    .code{display:inline-block;border:2px dashed #cbd5e1;border-radius:14px;padding:10px 18px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:24px;font-weight:800;letter-spacing:.12em}
    .big{font-size:32px;font-weight:900;margin:8px 0 4px}.src{margin-top:14px;font-size:11px;color:#9ca3af}
    .bar{position:fixed;top:12px;right:12px;display:flex;gap:8px}.bar button,.bar a{border:0;background:#111827;color:#fff;border-radius:999px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none}
    @media print{body{background:#fff}.card{box-shadow:none}.bar{display:none}}
  </style>
</head>
<body>
<div class="bar"><button onclick="window.print()">Yazdır</button><a id="dl" download="uygulama-qr.svg" href="#">SVG indir</a></div>
<div class="card" id="card">Yükleniyor…</div>
<script src="/widget/qr.js"></script>
<script>
  (function () {
    var q = new URLSearchParams(location.search), tenant = q.get('tenant') || '', src = (q.get('src') || 'print').replace(/[^a-z0-9_]/g, '');
    if (!tenant) { document.getElementById('card').textContent = 'tenant parametresi gerekli'; return; }
    var base = location.origin, go = base + '/w/' + tenant + '/app/go?src=' + src;
    fetch(base + '/w/' + tenant + '/app/config').then(function (r) { return r.json(); }).then(function (c) {
      var r = c.rules || {}, svg = YunbiQR.svg(go, { size: 280, ec: 'Q', margin: 2, color: '#111827' });
      document.getElementById('card').innerHTML = '<h1>' + (r.title || 'Uygulamayı indir') + '</h1><p>' + (r.subtitle || '') + '</p>' + (r.discount_label ? '<div class="big">' + r.discount_label + '</div>' : '') +
        '<div class="qr">' + svg + '</div>' + (r.code && r.show_code_web !== false ? '<div class="code">' + r.code + '</div>' : '') + (r.terms ? '<p style="margin-top:12px">' + r.terms + '</p>' : '') + '<div class="src">Kamerayla okutun · cihazınıza göre App Store / Google Play açılır · kaynak: ' + src + '</div>';
      document.getElementById('dl').href = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    }).catch(function () { document.getElementById('card').textContent = 'Ayarlar alınamadı (widget kapalı olabilir).'; });
  })();
</script>
</body>
</html>
